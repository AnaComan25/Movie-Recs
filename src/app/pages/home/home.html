<div class="landing-page">
  <div class="title-container"><h1>Movie Rec Tracker</h1></div>
  <div class="subtitle-container">
    <span>Just for you and I &#9825;</span>
    <span>I want to watch all of your favs &#9786;</span>
  </div>
  <div class="element-container">
    <div class="element-title-container">
      <h3>ADD MOVIE</h3>
    </div>
    <div class="actual-element-container">
      <input class="movie-input" type="text" name="movieTitle" [(ngModel)]="movieTitle" placeholder="Movie Title" />
      <input class="movie-input" type="text" name="director" [(ngModel)]="director" placeholder="Director (Optional)" />
      <input class="movie-input" type="text" name="year" [(ngModel)]="year" placeholder="Year (Optional)" />
      <button class="movie-button" (click)="addMovie()">Add to list</button>
    </div>
  </div>
  <div class="element-container view">
    <div class="element-title-container view">
      <h3>VIEW MOVIE LIST</h3>
    </div>
    <div class="actual-element-container view">
      <button class="movie-button view" (click)="haveTheseMoviesBeenWatched(false)">To Watch</button>
      <button class="movie-button view" (click)="haveTheseMoviesBeenWatched(true)">Watched</button>
    </div>
  </div>
</div>
