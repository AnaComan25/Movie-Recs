name: Build and Deploy Angular PWA

on:
  push:
    branches:
      - main # Triggers the build automatically whenever you update your main code

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Installs all the required dependencies to compile your app
      - name: Install Dependencies
        run: npm ci

      # SECURE INJECTION: This builds the environment.ts file in the cloud out of thin air
      - name: Inject Environment Variables
        run: |
          mkdir -p src/environments
          echo "export const environment = { production: true, movieDBApiKey: '${{ secrets.MOVIE_DB_API_KEY }}', supabaseApiKey: '${{ secrets.SUPABASE_API_KEY }}', supabaseURL: '${{ secrets.SUPABASE_URL }}' };" > src/environments/environment.ts

      # Compiles your project into raw, optimized web files
      - name: Build Production App
        run: npx ng build --configuration production --base-href=/Movie-Recs/

      # Cleans out your 'deploy' branch completely and drops in the working app
      - name: Deploy to GitHub Pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/movie-recs/browser
          branch: deploy
